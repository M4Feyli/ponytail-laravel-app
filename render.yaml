# Render.com Blueprint — free tier, no credit card required.
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. Render reads this file and
# creates the web service + database together.
#
# Free-tier notes: the web service sleeps after 15 minutes idle (30-50s
# cold start on the next request) and the free Postgres database expires
# 30 days after creation — fine for trying this out, not for anything
# that needs to stay up or keep data long-term.
services:
  - type: web
    name: ponytail-laravel-app
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: OCTANE_SERVER
        value: frankenphp
      # Render's free tier throttles CPU hard enough (GOMAXPROCS=1) that
      # Octane's worker-mode boot can't finish inside FrankenPHP's startup
      # retry budget, so the app never comes up ("too many consecutive
      # failures"). Classic (non-worker) mode boots PHP fresh per request
      # like php-fpm, sidestepping that startup gate entirely. See
      # docker/entrypoint.sh for the full explanation.
      - key: FRANKENPHP_CLASSIC_MODE
        value: "true"
      # generateValue produces a generic random string, not Laravel's
      # required "base64:<32 random bytes>" format -- the app's Encrypter
      # (used for session/cookie encryption) rejects it with "Unsupported
      # cipher or incorrect key length", which crashes every request that
      # touches sessions (i.e. everything except the plain /up healthcheck).
      # Generated locally with:
      #   php -r "echo 'base64:'.base64_encode(random_bytes(32));"
      - key: APP_KEY
        value: base64:34MLzZuEuwo+wqPVE4GenWASBwAYXAFnXRI/cHrfmGY=
      # Storage::url() (used for every product/category image) bakes this
      # into the generated URL at config-cache time -- it does NOT fall
      # back to the live request host like route()/asset() do. Must match
      # the service's actual Render URL exactly (check the dashboard's
      # "..onrender.com" address under Settings -> the top of the page).
      - key: APP_URL
        value: https://ponytail-laravel-app.onrender.com
      - key: ASSET_URL
        value: https://ponytail-laravel-app.onrender.com
      - key: TRUSTED_PROXIES
        value: "*"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEEDS
        value: "true"
      - key: ADMIN_NAME
        value: Admin1010
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ponytail-laravel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ponytail-laravel-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ponytail-laravel-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ponytail-laravel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ponytail-laravel-db
          property: password

databases:
  - name: ponytail-laravel-db
    plan: free
    databaseName: ponytail
    user: ponytail
